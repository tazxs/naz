<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="">
        <p>
            <i>Пожалуйста заполните эту форму. Обязательные поля отмечены *</i>
        </p>
        <fieldset> 
            <legend>Контактная информация</legend>
        <label for="n">Name *</label>
        <input type="text" name="n" id="" required> <br>
        <label for="e">email *</label>
        <input type="email" name="e" id="" required> <br>
        <label for="p">Phone number</label>
        <input type="tel" name="p" id=""> <br>
        </fieldset>
        <fieldset>
            <legend>Персональная информация</legend>
            <label for="a">Age *</label>
            <input type="number" name="a" id="" required> <br>
            <label for="g">Gender</label>
            <select name="" id="g">
                <option value="">Female</option>
                <option value="">Male</option>
            </select> <br>
            <label for="q">Личные качества</label>
            <input type="text" name="q" id="">
        </fieldset>
        <fieldset>
            <legend>Favorite animals</legend>
            <label for="z"></label>
            <input type="checkbox" name="z" id=""> zebra
            <label for="c"></label>
            <input type="checkbox" name="c" id=""> cat
            <label for="a"></label>
            <input type="checkbox" name="a" id=""> anaconda
            <label for="h"></label>
            <input type="checkbox" name="h" id=""> human
            <label for="e"></label>
            <input type="checkbox" name="e" id=""> elephant
            <label for="antilope"></label>
            <input type="checkbox" name="antilope" id=""> antilope
            <label for="p"></label>
            <input type="checkbox" name="p" id=""> pigeon
            <label for="crab"></label>
            <input type="checkbox" name="crab" id=""> crab
        </fieldset>
        <input type="submit" name="" id="">
    </form>
</body>
</html>
